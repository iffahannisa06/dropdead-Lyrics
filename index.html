
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drop dead ♡ Olivia Rodrigo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <p class="top-text">♡ MY LITTLE MUSIC SPACE ♡</p>

        <div class="music-card">
            <div class="album">
                <span>♡</span>
                <p>DROP DEAD</p>
            </div>

            <h1>drop dead</h1>
            <p class="artist">Olivia Rodrigo</p>

            <div class="lyrics">
                <p class="label">NOW PLAYING</p>
                <h2 id="lyrics">your favorite lyrics go here ♡</h2>
                <p class="hint">lyrics by ♡ iffah annisa ♡</p>
            </div>

            <div class="progress">
                <span id="current">0:00</span>
                <input type="range" id="seek" value="0" min="0" max="100">
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="prev">⏮</button>
                <button id="play">▶</button>
                <button id="next">⏭</button>
            </div>

            <p class="footer">made with love ♡</p>
        </div>
    </div>

    <audio id="music" src="Olivia Rodrigo - drop dead.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
